<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SlushUp | Premium Event Beverages & Frozen Treats</title>

    <!-- Primary Meta -->
    <meta
      name="description"
      content="SlushUp delivers premium frozen treats, signature cocktails, and professional mobile bar experiences for weddings, corporate events, and celebrations."
    />
    <meta
      name="keywords"
      content="SlushUp, mobile bar, event beverages, frozen cocktails, slushies, mocktails, weddings, corporate events, premium bartending"
    />
    <meta name="author" content="SlushUp" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SlushUp" />
    <meta property="og:title" content="SlushUp | Premium Event Beverages" />
    <meta
      property="og:description"
      content="Premium frozen treats and beverage experiences crafted for unforgettable events."
    />

    <!-- Primary OG Image (BEST – wide) -->
    <meta property="og:image" content="/drinks-image-cheers-wide.jpeg" />
    <meta property="og:image:secure_url" content="/drinks-image-cheers-wide.jpeg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Fallback OG Image -->
    <meta property="og:image" content="/bar-image-with-people.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SlushUp | Premium Event Beverages" />
    <meta
      name="twitter:description"
      content="Premium frozen treats and beverage experiences crafted for unforgettable events."
    />
    <meta name="twitter:image" content="/drinks-image-cheers-wide.jpeg" />

    <!-- Theme -->
    <meta name="theme-color" content="#1f8f6b" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
