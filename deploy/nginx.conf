# Static origin behind a TLS-terminating CDN or reverse proxy.
server {
    listen 8080;
    server_name slushuptt.com;
    root /var/www/slushup/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location /_app/immutable/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(woff2|jpg|jpeg|png|ico|mp4|vtt|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
}
